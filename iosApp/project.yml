# XcodeGen spec for the SwiftUI app. Generate the project with:
#   brew install xcodegen && xcodegen --spec iosApp/project.yml
name: Ledgerly
options:
  bundleIdPrefix: app.ledgerly
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Ledgerly:
    type: application
    platform: iOS
    sources:
      - path: Ledgerly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ledgerly
        PRODUCT_NAME: Ledgerly
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ledgerly
        INFOPLIST_KEY_NSFaceIDUsageDescription: Ledgerly uses Face ID to unlock when app lock is on.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The Kotlin framework built by the script below.
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "Shared", "-lsqlite3"]
    preBuildScripts:
      - name: Check the Xcode project is current
        basedOnDependencyAnalysis: false
        script: |
          # The project is generated from project.yml. If project.yml changed since, build settings
          # such as -lsqlite3 can be missing and the link fails with undefined symbols.
          if [ "$SRCROOT/project.yml" -nt "$PROJECT_FILE_PATH/project.pbxproj" ]; then
            echo "error: iosApp/project.yml changed after Ledgerly.xcodeproj was generated. Run: xcodegen --spec iosApp/project.yml"
            exit 1
          fi
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED being set to YES"
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
schemes:
  Ledgerly:
    build:
      targets:
        Ledgerly: all
    run:
      config: Debug
    archive:
      config: Release
